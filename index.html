<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Colorpedia</title>
  <meta name="description" content="A name-first color picker: English, German, and Brand colors — deduplicated by hex." />
  <meta name="theme-color" content="#0b0c10" />
  <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://colorpedia.org">
  <link rel="dns-prefetch" href="//colorpedia.org">
  <link rel="preload" href="./colors.json" as="fetch">
<link rel="apple-touch-icon" href="./Icon.svg" />
  <link rel="icon" href="./Icon.svg" type="image/svg+xml" />
  <style>
    :root {
      --bg: #0b0c10;
      --text: #e9e9ee;
      --muted: #a7a7b4;
      --border: rgba(255,255,255,.12);
      --shadow: 0 10px 35px rgba(0,0,0,.35);
      --radius: 16px;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    /* Dark scrollbars */
    * { scrollbar-width: thin; scrollbar-color: rgba(233,233,238,.30) rgba(0,0,0,.25); }
    *::-webkit-scrollbar { width: 10px; height: 10px; }
    *::-webkit-scrollbar-track { background: rgba(0,0,0,.25); }
    *::-webkit-scrollbar-thumb {
      background: rgba(233,233,238,.22);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,.25);
    }
    *::-webkit-scrollbar-thumb:hover { background: rgba(233,233,238,.32); }

    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(255,255,255,.08), transparent 55%),
        radial-gradient(900px 600px at 110% 10%, rgba(255,255,255,.06), transparent 55%),
        var(--bg);
      color: var(--text);
    }
    .app { max-width: 1240px; margin: 22px auto; padding: 0 16px; }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .topbar {
      display: flex; gap: 10px; align-items: center;
      padding: 14px;
      background: rgba(0,0,0,.18);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }
    .brand {
      display:flex; align-items:center; gap: 10px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--text);
      font-weight: 700;
      user-select: none;
    
      text-decoration: none;
    }
    .brand:hover { background: rgba(255,255,255,.08); }

    .brand small { font-weight: 500; color: var(--muted); }
    .search {
      flex: 1; min-width: 240px;
      display: flex; gap: 10px; align-items: center;
      background: rgba(0,0,0,.25);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 12px;
    }
    .search input { width: 100%; background: transparent; border: 0; color: var(--text); outline: none; font-size: 14px; }
    .pill {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.25);
      color: var(--muted);
      font-size: 12px;
      user-select: none;
      white-space: nowrap;
    }
    .kbd { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 11px; color: var(--muted); }
    .btn {
      display:inline-flex; align-items:center; gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      user-select: none;
    }
    .btn:hover { background: rgba(255,255,255,.10); }
    .btn.secondary { color: var(--muted); }

    .radarWrap { display: flex; flex-direction: column; margin-top: 10px; border: 1px solid var(--border); border-radius: 14px; padding: 6px; height: clamp(150px, 46vw, 220px); box-sizing: border-box; overflow: hidden; }
    .radarWrap svg { display: block; width: 100%; flex: 1 1 auto; min-height: 0; }
    .radarWrap text { font: 11px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial; }

    .rgbBars { display: grid; gap: 4px; margin-top: 6px; padding: 0 2px 2px; }
    .rgbBar { display: grid; grid-template-columns: 14px 1fr 30px; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); }
    .rgbBar .k { font-weight: 700; color: var(--text); }
    .rgbBar .v { text-align: right; font-variant-numeric: tabular-nums; color: var(--text); opacity: .85; }
    .rgbBar .t { height: 8px; border-radius: 999px; background: var(--rgbTrackBg, rgba(255,255,255,.10)); border: 1px solid var(--rgbTrackBorder, rgba(0,0,0,.20)); overflow: hidden; }
    .rgbBar .f { height: 100%; width: 0%; border-radius: inherit; }
    #barR { background: rgba(255, 80, 80, .85); }
    #barG { background: rgba(80, 255, 140, .78); }
    #barB { background: rgba(90, 160, 255, .82); }

    .rgbBar.hue .t {
      position: relative;
      background: linear-gradient(90deg, #ff0000 0%, #ffff00 16%, #00ff00 33%, #00ffff 50%, #0000ff 66%, #ff00ff 83%, #ff0000 100%);
      border-color: rgba(0,0,0,.18);
    }
    .rgbBar.hue .m {
      position: absolute;
      top: -2px;
      bottom: -2px;
      width: 2px;
      left: 0%;
      background: var(--text);
      opacity: .92;
      transform: translateX(-1px);
      border-radius: 2px;
      box-shadow: 0 0 0 1px rgba(0,0,0,.28);
    }

    .layout { display: grid; grid-template-columns: 240px 1fr 360px; min-height: 700px; }
    @media (max-width: 1120px) { .layout { grid-template-columns: 240px 1fr; } .preview { grid-column: 1 / -1; border-left: none; border-top: 1px solid var(--border); } }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } .sidebar { display: none; } }
    @media (max-width: 760px) {
      /* Keep the preview visible on mobile so map taps show color info */
      .preview { border-left: none; border-top: 1px solid var(--border); position: sticky; bottom: 0; z-index: 30; }
      .bigSwatch { height: clamp(150px, 46vw, 220px); }

      .radarWrap { height: clamp(150px, 46vw, 220px); }
.mapWrap { overflow: auto; max-height: 72vh; -webkit-overflow-scrolling: touch; }
      .mapWrap svg { width: 100%; height: auto; max-height: none; }
    }

    #touchHints { display: none; }

    @media (hover: none), (pointer: coarse) {
      /* No keyboard shortcut hint on touch devices */
      .pill[title="Keyboard shortcuts"] { display: none; }
      #touchHints { display: inline-flex; }
    }


    .sidebar { border-right: 1px solid var(--border); background: rgba(0,0,0,.10); padding: 12px; }
    .sidebar h3 { margin: 12px 6px 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    .tabs { display: flex; flex-direction: column; gap: 8px; }
    .tab {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      font-size: 14px;
    }
    .tab small { color: var(--muted); font-size: 12px; }
    .tab.active { background: rgba(255,255,255,.10); border-color: rgba(255,255,255,.20); }

    .main { padding: 12px; background: rgba(0,0,0,.08); }
    .sectionTitle { display:flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 6px 10px; }
    .sectionTitle h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .sectionTitle .hint { color: var(--muted); font-size: 12px; }

    .viewSwitch { display:flex; gap: 8px; align-items:center; }
    .seg { display:flex; border: 1px solid var(--border); border-radius: 999px; overflow: hidden; background: rgba(0,0,0,.18); }
    .seg button { border: 0; padding: 8px 10px; background: transparent; color: var(--muted); cursor: pointer; font-size: 12px; }
    .seg button.active { color: var(--text); background: rgba(255,255,255,.10); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(22px, 1fr));
      gap: 6px;
      padding: 6px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      max-height: 560px;
      overflow: auto;
      outline: none;
    }
    .swatch {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 7px;
      border: 1px solid rgba(0,0,0,.25);
      outline: 0;
      cursor: pointer;
      transition: transform .05s ease;
    }
    .swatch:hover { transform: translateY(-1px); }
    .swatch:focus { box-shadow: 0 0 0 2px rgba(255,255,255,.65); }
    .swatch.selected { box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 0 5px rgba(255,255,255,.20); }

    .mapWrap {
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
      padding: 8px;
      max-height: none;
      overflow: hidden;
      touch-action: manipulation;
    }
    .mapWrap svg { display: block; max-width: 100%; max-height: calc(100vh - 260px); min-height: 420px; width: auto; height: auto; margin: 0 auto; }
    .mapWrap [data-hex] { cursor: pointer; transition: opacity .12s ease; }
    .mapWrap [data-hex].dim { opacity: .10; pointer-events: none; }
    .mapWrap [data-hex].sel {
      stroke: rgba(255,255,255,.95) !important;
      stroke-opacity: 1 !important;
      stroke-width: 2 !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }
    .extraHexGrid{
      margin-top: 10px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(26px, 1fr));
      gap: 8px;
      padding: 8px 6px 6px;
      border-top: 1px solid var(--border);
    }
    .hexTile{
      width: 100%;
      aspect-ratio: 1 / 1;
      border: 1px solid rgba(0,0,0,.25);
      background: transparent;
      padding: 0;
      cursor: pointer;
      clip-path: polygon(25% 6.7%, 75% 6.7%, 100% 50%, 75% 93.3%, 25% 93.3%, 0% 50%);
      outline: none;
      transition: transform .05s ease;
    }
    .hexTile:hover { transform: translateY(-1px); }
    .hexTile:focus { box-shadow: 0 0 0 2px rgba(255,255,255,.65); }
    .hexTile.sel { box-shadow: 0 0 0 2px rgba(255,255,255,.95), 0 0 0 5px rgba(255,255,255,.20); }


    .rows { display: grid; gap: 10px; margin-top: 12px; }
    .miniRow {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 10px;
      align-items: center;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,.18);
    }
    .miniRow .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
    .miniGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(18px, 1fr)); gap: 6px; }
    .miniSwatch { width: 100%; aspect-ratio: 1/1; border-radius: 6px; border: 1px solid rgba(0,0,0,.25); cursor: pointer; }

    .preview { border-left: 1px solid var(--border); background: rgba(0,0,0,.10); padding: 12px; }
    .previewCard { border: 1px solid var(--border); background: rgba(0,0,0,.18); border-radius: 16px; padding: 12px; }
    .bigSwatch { height: 140px; border-radius: 14px; border: 1px solid rgba(0,0,0,.25); position: relative; overflow: hidden; }
    .bigSwatch::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.16), transparent 42%); pointer-events: none; }

    .kv { display: grid; gap: 8px; margin-top: 12px; }
    .kv .row { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 13px; align-items: flex-start; }
    .value { display:flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 270px; }

    .nameChip {
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }
    .nameChip:hover { background: rgba(255,255,255,.10); }
    .nameChip.de { border-style: dashed; }
    .nameChip.brand { border-style: dotted; }

    .tag {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      height: 18px;
      padding: 0 6px;
      border-radius: 999px;
      font-size: 10px;
      letter-spacing: .06em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(0,0,0,.22);
      color: rgba(255,255,255,.85);
    }

    code {
      color: var(--text);
      background: rgba(255,255,255,.06);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      white-space: nowrap;
      user-select: text;
    }
    .btnRow { display:flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      background: rgba(0,0,0,.80);
      border: 1px solid rgba(255,255,255,.18);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
  
    .mapTabs { display: flex; gap: 8px; align-items: center; margin: 8px 0 10px; flex-wrap: wrap; }
    .mapTabs .seg { border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.06); color: rgba(255,255,255,.92); padding: 6px 10px; border-radius: 999px; cursor: pointer; font-weight: 600; }
    .mapTabs .seg.active { background: rgba(255,255,255,.14); }
    .mapPane { display: none; }
    .mapPane.active { display: block; }
    .mapPane svg { max-width: 100%; height: auto; }

    .footer {
      padding: 14px 6px 0;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .footer .sep { opacity: .5; margin: 0 6px; }
    .heart { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 999px; border: 1px solid var(--border); background: rgba(0,0,0,.25); text-decoration: none; line-height: 1; transform-origin: 50% 60%; animation: heartPump 1.15s ease-in-out infinite; }
    .heart:hover { background: rgba(255,255,255,.08); }
    @keyframes heartPump { 0%, 100% { transform: scale(1); } 35% { transform: scale(1.18); } 55% { transform: scale(0.98); } }
    @media (prefers-reduced-motion: reduce) { .heart { animation: none; } }

    .footer a {
      color: var(--muted);
      text-decoration: none;
      border-bottom: 1px dotted rgba(255,255,255,.25);
    }
    .footer a:hover { color: var(--text); }

    .footer a.heart { border-bottom: 0 !important; }
    .heart { width: 1.9em; height: 1.9em; font-size: 1.35em; line-height: 1; }



    /* Cookie consent banner */
    .cookieConsent{position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;display:flex;justify-content:center}
    .cookieConsent.hidden{display:none}
    .cookieConsent .cookieBox{max-width:820px;width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between;
      border:1px solid var(--border);border-radius:16px;padding:12px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px)}
    .cookieConsent .cookieText{flex:1;min-width:240px;color:var(--muted);font-size:12px;line-height:1.35}
    .cookieConsent .cookieTitle{color:var(--text);font-weight:750;margin-right:6px}
    .cookieConsent .cookieLink{margin-left:8px;color:var(--text);text-decoration:none;border-bottom:1px solid rgba(255,255,255,.25)}
    .cookieConsent .cookieLink:hover{border-bottom-color:rgba(255,255,255,.55)}
    .cookieConsent .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);
      background:rgba(255,255,255,.06);color:var(--text);cursor:pointer;font-size:13px;user-select:none}
    .cookieConsent .btn:hover{background:rgba(255,255,255,.10)}
    .cookieConsent .btn.secondary{color:var(--muted)}
    .cookieConsent .cookieActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
    @media (max-width:520px){
      .cookieConsent .cookieBox{flex-direction:column;align-items:stretch}
      .cookieConsent .cookieActions .btn{width:100%;justify-content:center}
      .cookieConsent .cookieText{min-width:0}
    }

</style>
</head>
<body>
    <!-- Cookie consent (rendered immediately; hidden after consent check) -->
  <div id="cookieConsent" class="cookieConsent" role="dialog" aria-live="polite" aria-label="Cookie consent">
    <div class="cookieBox">
      <div class="cookieText">
        <span class="cookieTitle">🍪 Cookies</span>
        <span>We use cookies/localStorage to remember your settings. No tracking.</span>
        <a class="cookieLink" href="./imprint.html">Imprint</a>
      </div>
      <div class="cookieActions">
        <button id="cookieDecline" type="button" class="btn secondary">Decline</button>
        <button id="cookieAccept" type="button" class="btn">Accept</button>
      </div>
    </div>
  </div>

<div class="app">
    <div class="card">
      <div class="topbar">
        <a class="brand" href="https://colorpedia.org">
          <span>🎨</span> <span>Colorpedia</span>
          <small id="metaCounts"></small>
        </a>

        <div class="search" title="Search by name or hex">
          <span style="opacity:.8">🔎</span>
          <input id="q" placeholder="Search names (Onyx, Rot, Google Blue…) or #hex" autocomplete="off" />
          <button class="btn secondary" id="clearBtn" type="button" style="padding:8px 10px;border-radius:999px;">Clear</button>
        </div>

        <div class="viewSwitch">
          <div class="seg">
            <button id="viewMap" class="active" type="button">Map</button>
            <button id="viewGrid" type="button">Grid</button>
          </div>
          <div class="pill" title="Keyboard shortcuts">
            <span class="kbd">↑↓←→</span><span>move</span> · <span class="kbd">Enter</span><span>pick</span> · <span class="kbd">f</span><span>favorite</span> · <span class="kbd">/</span><span>search</span>
          </div>
          <div class="pill" id="touchHints" title="Swipe shortcuts">
            <span class="kbd">←→</span><span>swipe</span> · <span class="kbd">tap</span><span>pick</span>
          </div>
        </div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <h3>Filter</h3>
          <div class="tabs" id="sourceTabs"></div>

          <h3>Families</h3>
          <div class="tabs" id="familyTabs"></div>
        </aside>

        <main class="main">
          <div class="sectionTitle">
            <h2 id="title">All</h2>
            <div class="hint" id="hint"></div>
          </div>

          <div id="gridWrap" class="grid" tabindex="0" aria-label="Color grid" style="display:none"></div>

          <div id="mapWrap" class="mapWrap" aria-label="Color map">
            <?xml version="1.0" encoding="UTF-8"?>
<div class="mapPane active" data-map="hex">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600.0 666.217782649107" width="600.0" height="666.217782649107" shape-rendering="crispEdges">
  <polygon points="305.00,333.11 295.00,333.11 290.00,324.45 295.00,315.79 305.00,315.79 310.00,324.45" fill="#ffffff" data-name="White &#183; Wei&#223;" data-hex="#ffffff" stroke="#444444" stroke-width="1" stroke-opacity="0.25">
    <title>White &#183; Wei&#223; #ffffff</title>
  </polygon>
  <polygon points="305.00,644.88 295.00,644.88 290.00,636.22 295.00,627.56 305.00,627.56 310.00,636.22" fill="#000000" data-name="Black &#183; Schwarz" data-hex="#000000" data-brands="Apple|TikTok" data-aliases="Apple|Tik Tok" stroke="#444444" stroke-width="1" stroke-opacity="0.25">
    <title>Black &#183; Schwarz #000000</title>
  </polygon>
  <polygon points="320.00,341.77 310.00,341.77 305.00,333.11 310.00,324.45 320.00,324.45 325.00,333.11" fill="#fffafa" data-name="Snow &#183; Schnee" data-hex="#fffafa" stroke="#444444" stroke-width="1" stroke-opacity="0.25">
    <title>Snow &#183; Schnee #fffafa</title>
  </polygon>
  <polygon points="305.00,350.43 295.00,350.43 290.00,341.77 295.00,333.11 305.00,333.11 310.00,341.77" fill="#fffaf0" data-name="Floral White &#183; Bl&#252;tenwei&#223;" data-hex="#fffaf0" stroke="#444444" stroke-width="1" stroke-opacity="0.25">
    <title>Floral White &#183; Bl&#252;tenwei&#223; #fffaf0</title>
  </polygon>
  <polygon points="290.00,341.77 280.00,341.77 275.00,333.11 280.00,324.45 290.00,324.45 295.00,333.11" fill="#fffff0" data-name="Ivory &#183; Elfenbein" data-hex="#fffff0" stroke="#444444" stroke-width="1" stroke-opacity="0.25">
    <title>Ivory &#183; Elfenbein #fffff0</title>
  </polygon>
  <polygon points="290.00,324.45 280.00,324.45 275.00,315.79 280.00,307.13 290.00,307.13 295.00,315.79" fill="#ffffed" data-name="Light Yellow &#183; Hellgelb" data-hex="#ffffed" stroke="#444444" stroke-width="1" stroke-opacity="0.25">
    <title>Light Yellow &#183; Hellgelb #ffffed</title>
  </polygon>

  <script>
    
let DATA = null;


function initCookieConsent() {
  const banner = document.getElementById("cookieConsent");
  if (!banner) return;
  const key = "colorpedia_cookie_consent";
  const val = (() => {
    try { return localStorage.getItem(key); } catch { return null; }
  })();
  if (val === "yes" || val === "no") banner.classList.add("hidden");

  const accept = document.getElementById("cookieAccept");
  const decline = document.getElementById("cookieDecline");

  const set = (v) => {
    try { localStorage.setItem(key, v); } catch {}
    try { document.cookie = `colorpedia_cookie_consent=${v}; Max-Age=31536000; Path=/; SameSite=Lax`; } catch {}
    banner.classList.add("hidden");
  };

  accept && accept.addEventListener("click", () => set("yes"));
  decline && decline.addEventListener("click", () => set("no"));
}

async function boot() {
  
  initCookieConsent();
try {
    const res = await fetch("./colors.json");
    if (!res.ok) throw new Error(`Failed to fetch colors.json: ${res.status} ${res.statusText}`);
    DATA = await res.json();
  } catch (e) {
    console.error(e);
    const meta = document.getElementById("metaCounts");
    if (meta) meta.textContent = " (failed to load colors.json — serve via HTTP)";
    const hint = document.createElement("div");
    hint.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;padding:10px 12px;border-radius:12px;background:#111;color:#fff;opacity:.95;font:14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, Arial;";
    hint.innerHTML = "<b>Couldn’t load colors.json.</b> If you opened this via <code>file://</code>, browsers block <code>fetch()</code>. Run a local server (e.g. <code>python -m http.server</code>) and open <code>http://localhost:8000</code>.";
    document.body.appendChild(hint);
    return;
  }

    const COLORS = DATA.colors;

    // Sanity: only pure primaries get the base German names (Grün/Rot/Blau).
    (() => {
      const HEX_GREEN = "#00ff00";
      const HEX_RED = "#ff0000";
      const HEX_BLUE = "#0000ff";
      for (const c of COLORS) {
        if (!c || !c.names_de) continue;
        const hx = String(c.hex || "").toLowerCase();
        c.names_de = (c.names_de || []).filter((n) => {
          const s = String(n || "").trim();
          if (!s) return false;
          const low = s.toLowerCase();
          if (low === "grün") return hx === HEX_GREEN;
          if (low === "rot") return hx === HEX_RED;
          if (low === "blau") return hx === HEX_BLUE;
          return true;
        });
      }
    })();


    const SOURCES = ["All Colors", "English Colors", "German Colors", "Brand Colors"];
    const FAMILIES = ["All", "Neutrals", "Reds", "Oranges", "Yellows", "Greens", "Blues", "Purples", "Pinks", "Browns"];
    const LS_FAV = "namedColorFavorites:v3";
    const LS_RECENT = "namedColorRecent:v3";

    const els = {
      q: document.getElementById("q"),
      clearBtn: document.getElementById("clearBtn"),
      sourceTabs: document.getElementById("sourceTabs"),
      familyTabs: document.getElementById("familyTabs"),
      title: document.getElementById("title"),
      hint: document.getElementById("hint"),
      gridWrap: document.getElementById("gridWrap"),
      mapWrap: document.getElementById("mapWrap"),
      viewGrid: document.getElementById("viewGrid"),
      viewMap: document.getElementById("viewMap"),
      favRow: document.getElementById("favRow"),
      recentRow: document.getElementById("recentRow"),
      bigSwatch: document.getElementById("bigSwatch"),
            radarWrap: document.getElementById("radarWrap"),
      radarSvg: document.getElementById("radarSvg"),
      barR: document.getElementById("barR"),
      barG: document.getElementById("barG"),
      barB: document.getElementById("barB"),
      valR: document.getElementById("valR"),
      valG: document.getElementById("valG"),
      valB: document.getElementById("valB"),
      hueMark: document.getElementById("hueMark"),
      valHue: document.getElementById("valHue"),
pName: document.getElementById("pName"),
      pHex: document.getElementById("pHex"),      copyHex: document.getElementById("copyHex"),
      copyNames: document.getElementById("copyNames"),
      copyBoth: document.getElementById("copyBoth"),
      toggleFav: document.getElementById("toggleFav"),
      toast: document.getElementById("toast"),
      metaCounts: document.getElementById("metaCounts"),
};
    // Mobile: shorter examples in the search placeholder
    function applySearchPlaceholder() {
      if (!els.q) return;
      const isTouch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      els.q.placeholder = isTouch
        ? "Search names (Onix, Rot) or #hex"
        : "Search names (Onyx, Rot, Google Blue…) or #hex";
    }
    applySearchPlaceholder();
    let _phTO = null;
    window.addEventListener("resize", () => {
      clearTimeout(_phTO);
      _phTO = setTimeout(applySearchPlaceholder, 120);
    }, { passive: true });


    els.metaCounts.textContent = "(" + DATA.meta.count_unique + " unique / " + DATA.meta.count_raw + " named)";

    const IS_COARSE = window.matchMedia && window.matchMedia("(hover: none), (pointer: coarse)").matches;


    function toast(msg) {
      els.toast.textContent = msg;
      els.toast.classList.add("show");
      setTimeout(() => els.toast.classList.remove("show"), 900);
    }

    async function copyText(t) {
      try {
        await navigator.clipboard.writeText(t);
        toast("Copied");
      } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = t;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        toast("Copied");
      }
    }

    // Convert CamelCase enum keys -> "Title Case" (with spaces)
    function prettyName(raw) {
      if (!raw) return "";
      const s = String(raw).trim();
      if (!s) return s;
      if (s.includes(" ")) return titleCase(s);
      const spaced = s
        .replace(/_/g, " ")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/([A-Z]+)([A-Z][a-z])/g, "$1 $2")
        .replace(/\s+/g, " ")
        .trim();
      return titleCase(spaced);
    }

    function titleCase(str) {
      return str.split(" ").map(w => {
        if (!w) return w;
        if (w.length <= 4 && w === w.toUpperCase()) return w; // keep short acronyms
        const lower = w.toLocaleLowerCase();
        return lower.charAt(0).toLocaleUpperCase() + lower.slice(1);
      }).join(" ");
    }

    // Normalize for search (ignore spaces/underscores/hyphens)
    function norm(s) {
      return String(s || "")
        .toLocaleLowerCase()
        .replace(/[\s_\-]+/g, "");
    }

    function loadSet(key) {
      try {
        const v = JSON.parse(localStorage.getItem(key) || "[]");
        if (Array.isArray(v)) return new Set(v);
      } catch (e) {}
      return new Set();
    }
    function saveSet(key, set) {
      localStorage.setItem(key, JSON.stringify([...set]));
    }
    function loadRecent() {
      try {
        const v = JSON.parse(localStorage.getItem(LS_RECENT) || "[]");
        if (Array.isArray(v)) return v.slice(0, 24);
      } catch (e) {}
      return [];
    }
    function saveRecent(arr) {
      localStorage.setItem(LS_RECENT, JSON.stringify(arr.slice(0, 24)));
    }

    const fav = loadSet(LS_FAV);
    let recent = loadRecent();

    let activeSource = "All Colors";
    let activeFamily = "All";
    let filtered = [];
    let selectedHex = null;
    let lastPickedHex = null;
    let focusIndex = 0;
    let view = "map";
function bestTextColor(hex) {
      const r = parseInt(hex.slice(1,3),16)/255;
      const g = parseInt(hex.slice(3,5),16)/255;
      const b = parseInt(hex.slice(5,7),16)/255;
      const lin = (c)=> c<=0.04045? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
      const L = 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
      return L > 0.40 ? "#000000" : "#ffffff";
    }


    function hexToRgb(hex) {
      const h = String(hex || "").trim().toLowerCase();
      if (!/^#([0-9a-f]{6})$/.test(h)) return null;
      return {
        r: parseInt(h.slice(1,3), 16),
        g: parseInt(h.slice(3,5), 16),
        b: parseInt(h.slice(5,7), 16),
      };
    }

    function hslSaturation01(rgb) {
      const r = rgb.r / 255, g = rgb.g / 255, b = rgb.b / 255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      const l = (max + min) / 2;
      if (max === min) return 0;
      const d = max - min;
      const s = d / (1 - Math.abs(2*l - 1));
      return Math.max(0, Math.min(1, s));
    }


    function hslHueDeg(rgb) {
      const r = rgb.r / 255, g = rgb.g / 255, b = rgb.b / 255;
      const max = Math.max(r,g,b), min = Math.min(r,g,b);
      if (max === min) return 0;
      const d = max - min;
      let h;
      if (max === r) h = ((g - b) / d) % 6;
      else if (max === g) h = ((b - r) / d) + 2;
      else h = ((r - g) / d) + 4;
      h *= 60;
      if (h < 0) h += 360;
      return h;
    }

    function updateHueBar(hex) {
      const rgb = hexToRgb(hex);
      if (!rgb || !els.hueMark || !els.valHue) return;
      const h = hslHueDeg(rgb);
      const pct = Math.max(0, Math.min(100, (h / 360) * 100));
      els.hueMark.style.left = pct.toFixed(2) + "%";
      els.valHue.textContent = Math.round(h) + "°";
    }

    function relLuminance01(rgb) {
      const r = rgb.r/255, g = rgb.g/255, b = rgb.b/255;
      const lin = (c)=> c<=0.04045? c/12.92 : Math.pow((c+0.055)/1.055, 2.4);
      return 0.2126*lin(r)+0.7152*lin(g)+0.0722*lin(b);
    }

    function updateRadar(hex) {
      if (!els.radarSvg || !els.radarWrap) return;
      const rgb = hexToRgb(hex);
      if (!rgb) { els.radarSvg.innerHTML = ""; return; }

      const r01 = rgb.r / 255;
      const g01 = rgb.g / 255;
      const b01 = rgb.b / 255;
      const tint01 = relLuminance01(rgb);
      const sat01 = hslSaturation01(rgb);

      const axes = [
        { label: "Red", value: r01 },
        { label: "Green", value: g01 },
        { label: "Blue", value: b01 },
        { label: "Tint", value: tint01 },
        { label: "Saturation", value: sat01 },
      ];

      // Background is black/white for contrast; only the polygon uses the color.
      const bg = bestTextColor(hex) === "#ffffff" ? "#ffffff" : "#000000";
      const fg = bg === "#ffffff" ? "#000000" : "#ffffff";
      els.radarWrap.style.background = bg;
      els.radarWrap.style.color = fg;
      els.radarWrap.style.setProperty("--rgbTrackBg", bg === "#ffffff" ? "rgba(0,0,0,.10)" : "rgba(255,255,255,.10)");
      els.radarWrap.style.setProperty("--rgbTrackBorder", bg === "#ffffff" ? "rgba(0,0,0,.18)" : "rgba(0,0,0,.20)");

      const svg = els.radarSvg;
      svg.innerHTML = "";

      const W = 220, H = 160;
      const cx = W / 2, cy = H / 2 + 2;
      const R = 52; // smaller

      const NS = "http://www.w3.org/2000/svg";
      const mk = (name, attrs={}) => {
        const el = document.createElementNS(NS, name);
        for (const [k,v] of Object.entries(attrs)) el.setAttribute(k, String(v));
        return el;
      };

      // Grid
      for (let step = 1; step <= 4; step++) {
        const rr = (R * step) / 4;
        const pts = axes.map((_, i) => {
          const a = (-Math.PI/2) + (i * 2*Math.PI/axes.length);
          return (cx + Math.cos(a) * rr).toFixed(2) + "," + (cy + Math.sin(a) * rr).toFixed(2);
        }).join(" ");
        svg.appendChild(mk("polygon", {
          points: pts,
          fill: "none",
          stroke: fg,
          "stroke-opacity": "0.22",
          "stroke-width": "1"
        }));
      }

      // Axes + labels
      axes.forEach((ax, i) => {
        const a = (-Math.PI/2) + (i * 2*Math.PI/axes.length);
        const x = cx + Math.cos(a) * R;
        const y = cy + Math.sin(a) * R;

        svg.appendChild(mk("line", {
          x1: cx, y1: cy, x2: x, y2: y,
          stroke: fg,
          "stroke-opacity": "0.22",
          "stroke-width": "1"
        }));

        let lx = cx + Math.cos(a) * (R + 18);
        let ly = cy + Math.sin(a) * (R + 18);

        // per-label nudges
        if (ax.label === "Saturation") lx -= 10;
        if (ax.label === "Green") lx += 10;

        let anchor = "middle";
        if (Math.cos(a) > 0.35) anchor = "start";
        else if (Math.cos(a) < -0.35) anchor = "end";

        const t = mk("text", {
          x: lx.toFixed(2),
          y: ly.toFixed(2),
          fill: fg,
          "fill-opacity": "0.92",
          "text-anchor": anchor,
          "dominant-baseline": "middle"
        });
        t.textContent = ax.label;
        svg.appendChild(t);
      });

      // Value polygon filled with the hovered/selected color
      const valPts = axes.map((ax, i) => {
        const a = (-Math.PI/2) + (i * 2*Math.PI/axes.length);
        const rr = R * Math.max(0, Math.min(1, ax.value));
        return (cx + Math.cos(a) * rr).toFixed(2) + "," + (cy + Math.sin(a) * rr).toFixed(2);
      }).join(" ");

      svg.appendChild(mk("polygon", {
        points: valPts,
        fill: hex,
        "fill-opacity": "0.82",
        stroke: fg,
        "stroke-opacity": "0.35",
        "stroke-width": "1"
      }));

      svg.appendChild(mk("circle", {
        cx: cx, cy: cy, r: 1.5,
        fill: fg,
        "fill-opacity": "0.55"
      }));
    }

function updateRgbBars(hex) {
      const rgb = hexToRgb(hex);
      if (!rgb || !els.barR || !els.barG || !els.barB) return;

      const set = (barEl, valEl, v) => {
        const pct = Math.max(0, Math.min(100, (v / 255) * 100));
        barEl.style.width = pct.toFixed(1) + "%";
        if (valEl) valEl.textContent = String(v);
        barEl.setAttribute("aria-valuenow", String(v));
      };

      set(els.barR, els.valR, rgb.r);
      set(els.barG, els.valG, rgb.g);
      set(els.barB, els.valB, rgb.b);
    }




    function findColor(hex) {
      return COLORS.find(c => c.hex === hex) || null;
    }

    function namesForSource(c, source) {
      if (source === "German Colors") return c.names_de || [];
      if (source === "Brand Colors") return c.names_brand || [];
      if (source === "English Colors") return c.names_en || [];
      return [...(c.names_en||[]), ...(c.names_de||[]), ...(c.names_brand||[])];
    }

    function langTagFor(raw, c) {
      if ((c.names_de||[]).includes(raw)) return "DE";
      if ((c.names_brand||[]).includes(raw)) return "BRAND";
      return "EN";
    }

    function buildChips(c) {
  els.pName.innerHTML = "";
  const frag = document.createDocumentFragment();

  const en = (c.names_en || []);
  const de = (c.names_de || []);
  const br = (c.names_brand || []);

  function addChip(raw) {
    const tag = langTagFor(raw, c);
    const chip = document.createElement("code");
    chip.className = "nameChip" + (tag === "DE" ? " de" : (tag === "BRAND" ? " brand" : ""));
    chip.setAttribute("data-raw", raw);
    chip.title = tag;
    chip.innerHTML = '<span class="tag">' + tag + '</span>' + (tag === "BRAND" ? String(raw) : prettyName(raw));
    chip.addEventListener("click", () => copyText(raw)); // copy enum key/original label
    frag.appendChild(chip);
  }

  // Always show EN -> DE -> BRAND (deduped), regardless of current filter tab.
  const seen = new Set();
  [...en, ...de, ...br].forEach((raw) => {
    if (!raw || seen.has(raw)) return;
    seen.add(raw);
    addChip(raw);
  });

  els.pName.appendChild(frag);
}

    function updatePreview(c, opts) {
      if (!c) return;
      opts = opts || {};      selectedHex = String(c.hex || "").toLowerCase();

      // Keep arrow-key navigation aligned with the selected item.
      const fi = filtered.findIndex(x => x.hex === selectedHex);
      if (fi >= 0) focusIndex = fi;
      els.bigSwatch.style.background = c.hex;
      buildChips(c);
      els.pHex.textContent = c.hex;

      const isFav = fav.has(c.hex);
      els.toggleFav.textContent = isFav ? "⭐ Remove favorite" : "⭐ Add favorite";

      for (const el of els.gridWrap.querySelectorAll(".swatch.selected")) el.classList.remove("selected");
      const target = [...els.gridWrap.querySelectorAll(".swatch")].find(el => el.dataset.hex === c.hex);
      if (target) target.classList.add("selected");

      const polys = els.mapWrap.querySelectorAll('[data-hex]');
      polys.forEach(p => p.classList.remove("sel"));
      polys.forEach(p => {
        const hx = (p.getAttribute("data-hex") || "").toLowerCase();
        if (hx === selectedHex) p.classList.add("sel");
      });
    

      updateRadar(selectedHex);
      updateRgbBars(selectedHex);
      updateHueBar(selectedHex);
    }

    function buildTabs(container, items, getCount, getActive, onPick) {
      container.innerHTML = "";
      for (const it of items) {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tab" + (it === getActive() ? " active" : "");
        btn.innerHTML = "<span>" + it + "</span><small>" + getCount(it) + "</small>";
        btn.addEventListener("click", () => onPick(it));
        container.appendChild(btn);
      }
    }

    function countForSource(source) {
      if (source === "English Colors") return COLORS.filter(c => (c.names_en||[]).length).length;
      if (source === "German Colors") return COLORS.filter(c => (c.names_de||[]).length).length;
      if (source === "Brand Colors") return COLORS.filter(c => (c.names_brand||[]).length).length;
      return COLORS.length;
    }
    function countForFamily(fam) {
      if (fam === "All") return COLORS.length;
      return COLORS.filter(c => (c.family || "Other") === fam).length;
    }

    function matchesQuery(c, q) {
      if (!q) return true;
      const qRaw = q.trim();
      if (!qRaw) return true;

      const qn = norm(qRaw);
      if (norm(c.hex).includes(qn)) return true;

      const names = namesForSource(c, activeSource);
      for (const raw of names) {
        if (norm(raw).includes(qn)) return true;
        if (norm(prettyName(raw)).includes(qn)) return true;
      }
      return false;
    }

    function listBySource(source) {
      if (source === "English Colors") return COLORS.filter(c => (c.names_en||[]).length);
      if (source === "German Colors") return COLORS.filter(c => (c.names_de||[]).length);
      if (source === "Brand Colors") return COLORS.filter(c => (c.names_brand||[]).length);
      return COLORS;
    }

    function listByFamily(list, fam) {
      if (fam === "All") return list;
      return list.filter(c => (c.family || "Other") === fam);
    }

    function computeFiltered() {
      const q = els.q.value.trim();
      const srcList = listBySource(activeSource);
      const famList = listByFamily(srcList, activeFamily);
      return q ? famList.filter(c => matchesQuery(c, q)) : famList.slice();
    }

    function swatchTitle(c) {
      const names = namesForSource(c, activeSource).map(prettyName);
      const all = names.length ? names.join(", ") : (c.names_en||[]).map(prettyName).join(", ");
      return all ? (all + " • " + c.hex) : c.hex;
    }

    function renderGrid(list) {
      els.gridWrap.innerHTML = "";
      const frag = document.createDocumentFragment();
      list.forEach((c, idx) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "swatch";
        b.style.background = c.hex;
        b.title = swatchTitle(c);
        b.dataset.hex = c.hex;
        b.dataset.index = String(idx);
        if (c.hex === selectedHex) b.classList.add("selected");
        b.addEventListener("mouseenter", () => updatePreview(c));
        b.addEventListener("focus", () => updatePreview(c));
        b.addEventListener("click", () => pickColor(c));
        frag.appendChild(b);
      });
      els.gridWrap.appendChild(frag);
      els.hint.textContent = list.length + " colors";
    }

    function renderMiniRows() {
      els.favRow.innerHTML = "";
      const favItems = COLORS.filter(c => fav.has(c.hex)).slice(0, 48);
      for (const c of favItems) {
        const d = document.createElement("div");
        d.className = "miniSwatch";
        d.style.background = c.hex;
        d.title = swatchTitle(c);
        d.addEventListener("click", () => pickColor(c));
        els.favRow.appendChild(d);
      }

      els.recentRow.innerHTML = "";
      const recentItems = recent.map(hex => findColor(hex)).filter(Boolean).slice(0, 48);
      for (const c of recentItems) {
        const d = document.createElement("div");
        d.className = "miniSwatch";
        d.style.background = c.hex;
        d.title = swatchTitle(c);
        d.addEventListener("click", () => pickColor(c));
        els.recentRow.appendChild(d);
      }
    }

    function pickColor(c) {
      updatePreview(c);
      lastPickedHex = c.hex;
      recent = [c.hex, ...recent.filter(x => x !== c.hex)].slice(0, 24);
      saveRecent(recent);
      renderMiniRows();
    }

    function setView(next) {
      view = next;
      els.viewGrid.classList.toggle("active", view === "grid");
      els.viewMap.classList.toggle("active", view === "map");
      els.gridWrap.style.display = view === "grid" ? "" : "none";
      els.mapWrap.style.display = view === "map" ? "" : "none";
      applyMapFilter();

      // Ensure selection stays in sync when switching between Grid/Map.
      const c = selectedHex ? findColor(String(selectedHex).toLowerCase()) : null;
      if (c) updatePreview(c);
    }

    function applyMapFilter() {
      const allowed = new Set(filtered.map(c => c.hex));
      if (selectedHex) allowed.add(String(selectedHex).toLowerCase());
      const polys = els.mapWrap.querySelectorAll('[data-hex]');
      polys.forEach(p => {
        const hx = (p.getAttribute("data-hex") || "").toLowerCase();
        p.classList.toggle("dim", !allowed.has(hx));
      });
    }
    function hydrateMapTooltips() {
      const nodes = els.mapWrap.querySelectorAll('[data-hex]');
      nodes.forEach(p => {
        const hx = (p.getAttribute("data-hex") || "").toLowerCase();
        const c = findColor(hx);
        if (!c) return;
        const names = [...(c.names_en||[]), ...(c.names_de||[]), ...(c.names_brand||[])].map(prettyName);
        const label = (names.join(" · ") + " " + c.hex).trim();
        p.setAttribute("data-name", names.join(" · "));
        // SVG polygons: keep <title>; HTML tiles: use title attribute.
        const isSvg = !!(p.ownerSVGElement);
        if (isSvg) {
          try {
            let title = p.querySelector("title");
            if (!title) {
              title = document.createElementNS("http://www.w3.org/2000/svg","title");
              p.appendChild(title);
            }
            title.textContent = label;
          } catch (e) {}
        } else {
          p.title = label;
        }
      });
    }

    // Unified map interaction (SVG polygons + extra hex tiles)
    function wireMapInteractions() {
      els.mapWrap.addEventListener("mousemove", (e) => {
        const t = (e.target instanceof Element) ? e.target.closest("[data-hex]") : null;
        if (!t) return;
        if (t.classList && t.classList.contains("dim")) return;
        const hx = (t.getAttribute("data-hex") || "").toLowerCase();
        if (!hx) return;
        const c = findColor(hx);
        if (c) updatePreview(c);
      });

      els.mapWrap.addEventListener("pointerdown", (e) => {
        const t = (e.target instanceof Element) ? e.target.closest("[data-hex]") : null;
        if (!t) return;
        if (t.classList && t.classList.contains("dim")) return;
        const hx = (t.getAttribute("data-hex") || "").toLowerCase();
        if (!hx) return;
        const c = findColor(hx);
        if (c) updatePreview(c);
      }, { passive: true });

      els.mapWrap.addEventListener("click", (e) => {
        const t = (e.target instanceof Element) ? e.target.closest("[data-hex]") : null;
        if (!t) return;
        if (t.classList && t.classList.contains("dim")) return;
        const hx = (t.getAttribute("data-hex") || "").toLowerCase();
        if (!hx) return;
        const c = findColor(hx);
        if (c) { try { e.preventDefault(); e.stopPropagation(); } catch (e2) {} pickColor(c); }
      });
    }
function render() {
      filtered = computeFiltered();

      buildTabs(els.sourceTabs, SOURCES, countForSource, () => activeSource, (v) => {
        activeSource = v;
        activeFamily = "All";
        render();
      });
      buildTabs(els.familyTabs, FAMILIES, countForFamily, () => activeFamily, (v) => {
        activeFamily = v;
        render();
      });

      els.title.textContent = activeSource + " · " + activeFamily;
      renderGrid(filtered);
      renderMiniRows();

      if (!selectedHex) {
        updatePreview(filtered[0] || COLORS[0]);
        lastPickedHex = selectedHex;
      }

      applyMapFilter();
      focusIndex = 0;
    }

    function moveFocusGrid(dx, dy) {
      if (!filtered.length || view !== "grid") return;

      // Keep focusIndex in sync with the actually focused swatch.
      const ae = document.activeElement;
      if (ae && ae instanceof HTMLElement && ae.classList.contains("swatch")) {
        const idx = parseInt(ae.dataset.index || "", 10);
        if (!Number.isNaN(idx)) focusIndex = idx;
      }

      // Use the real computed column count (prevents diagonal jumps).
      const colsStr = getComputedStyle(els.gridWrap).gridTemplateColumns || "";
      const perRow = Math.max(1, colsStr.trim() ? colsStr.trim().split(/\s+/).length : 1);

      const next = focusIndex + dx + dy * perRow;
      focusIndex = Math.max(0, Math.min(filtered.length - 1, next));

      const el = els.gridWrap.querySelector('.swatch[data-index="' + focusIndex + '"]');
      if (el) el.focus();
      updatePreview(filtered[focusIndex]);
    }

    els.q.addEventListener("input", () => render());
    els.clearBtn.addEventListener("click", () => {
      els.q.value = "";
      render();
      els.q.focus();
    });

    els.viewGrid.addEventListener("click", () => setView("grid"));
    els.viewMap.addEventListener("click", () => setView("map"));


    // Swipe left/right to switch between Map and Grid (touch devices)
    if (IS_COARSE) {
      let sx = 0, sy = 0, st = 0;
      const TH = 55; // px
      const isTextInput = (el) => {
        if (!el || !(el instanceof HTMLElement)) return false;
        const tag = el.tagName;
        return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
      };
      const isInHorizScroll = (el) => {
        let cur = el;
        while (cur && cur !== document.body) {
          if (cur instanceof HTMLElement) {
            const cs = getComputedStyle(cur);
            const ox = cs.overflowX;
            if ((ox === 'auto' || ox === 'scroll') && cur.scrollWidth > cur.clientWidth + 2) return true;
          }
          cur = cur.parentElement;
        }
        return false;
      };
      const onStart = (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        if (isTextInput(e.target)) return;
        if (isInHorizScroll(e.target)) return;
        const t = e.touches[0];
        sx = t.clientX; sy = t.clientY; st = Date.now();
      };
      const onEnd = (e) => {
        if (!st || !e.changedTouches || e.changedTouches.length !== 1) { st = 0; return; }
        const t = e.changedTouches[0];
        const dx = t.clientX - sx;
        const dy = t.clientY - sy;
        const dt = Date.now() - st;
        st = 0;
        if (dt > 900) return;
        if (Math.abs(dx) < TH) return;
        if (Math.abs(dy) > Math.abs(dx) * 0.75) return;
        setView(view === "map" ? "grid" : "map");
      };
      // Listen globally so swiping works anywhere, not only on the hex map/grid.
      document.addEventListener("touchstart", onStart, { passive: true });
      document.addEventListener("touchend", onEnd, { passive: true });
    }

    // Restore previously selected color when leaving hover areas (desktop)
    els.mapWrap.addEventListener("mouseleave", () => {
      if (!lastPickedHex) return;
      const c = findColor(String(lastPickedHex).toLowerCase());
      if (c) updatePreview(c);
    });
    els.gridWrap.addEventListener("mouseleave", () => {
      if (!lastPickedHex) return;
      const c = findColor(String(lastPickedHex).toLowerCase());
      if (c) updatePreview(c);
    });


    els.copyHex.addEventListener("click", () => {
      const c = findColor(selectedHex);
      if (c) copyText(c.hex);
    });
    els.copyNames.addEventListener("click", () => {
      const c = findColor(selectedHex);
      if (!c) return;
      const names = [...(c.names_en||[]), ...(c.names_de||[]), ...(c.names_brand||[])];
      copyText(names.join(", "));
    });
    els.copyBoth.addEventListener("click", () => {
      const c = findColor(selectedHex);
      if (!c) return;
      const names = [...(c.names_en||[]), ...(c.names_de||[]), ...(c.names_brand||[])].map(prettyName);
      copyText(names.join(" · ") + " (" + c.hex + ")");
    });
    els.toggleFav.addEventListener("click", () => {
      const c = findColor(selectedHex);
      if (!c) return;
      if (fav.has(c.hex)) fav.delete(c.hex); else fav.add(c.hex);
      saveSet(LS_FAV, fav);
      toast(fav.has(c.hex) ? "Added to favorites" : "Removed from favorites");
      renderMiniRows();
      updatePreview(c);
    });

    // Keyboard
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (els.q.value) {
          els.q.value = "";
          render();
          els.q.focus();
        }
        return;
      }
      if (e.key === "/") {
        e.preventDefault();
        els.q.focus();
        return;
      }
      if (document.activeElement === els.q) {
        if (e.key === "Enter") {
          if (filtered[0]) pickColor(filtered[0]);
        }
        return;
      }
      if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)) {
        e.preventDefault();
        if (e.key === "ArrowLeft") moveFocusGrid(-1, 0);
        if (e.key === "ArrowRight") moveFocusGrid(1, 0);
        if (e.key === "ArrowUp") moveFocusGrid(0, -1);
        if (e.key === "ArrowDown") moveFocusGrid(0, 1);
      }
      if (e.key === "Enter") {
        const c = filtered[focusIndex];
        if (c) { try { e.preventDefault(); e.stopPropagation(); } catch (e2) {} pickColor(c); }
      }
      if (e.key.toLowerCase() === "f") {
        const c = filtered[focusIndex] || findColor(selectedHex);
        if (!c) return;
        if (fav.has(c.hex)) fav.delete(c.hex); else fav.add(c.hex);
        saveSet(LS_FAV, fav);
        renderMiniRows();
        updatePreview(c);
      }
    });
wireMapInteractions();
    hydrateMapTooltips();
    render();
  
}

boot();
</script>
</body>
</html>
